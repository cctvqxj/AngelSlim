# Stage 1 of the HY4 data-free RTN MXFP4 + FP8 UE8M0 pipeline.
#
# Only main-model routed experts are converted to MXFP4 here. Stage 2 converts
# the remaining GEMM weights, including MTP, to FP8 E4M3 + UE8M0.
compression:
  quantization:
    name: mxfp4_weight_only
    bits: 4
    quant_method:
      weight: per-group
      group_size: 32
      num_workers: 8
      use_gpu: true
      include_patterns:
        - '^model\.layers\.(\d+)\.mlp\.experts\.(?:gate_up_proj|down_proj)$'
      exclude_patterns:
        - '^model\.mtp_layers\..*'

# NVFP4-AWQ + 4/6 with 128 Qwen3.6-templated ShareGPT calibration samples.
global:
  save_path: ./output/qwen3_6_a3b_nvfp4_awq_46_sharegpt128

model:
  name: Qwen3_5
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B/snapshots/995ad96eacd98c81ed38be0c5b274b04031597b0
  trust_remote_code: true
  low_cpu_mem_usage: true
  use_cache: false
  torch_dtype: auto
  device_map: cpu
  enable_expert_parallel: true

compression:
  name: PTQ
  quantization:
    name: nvfp4_awq
    bits: 4
    quant_method:
      weight: "per-group"
      group_size: 16
      zero_point: false
      mse_range: false
      four_over_six: true
    ignore_layers:
      - "lm_head"
      - "visual"
      - "self_attn"
      - "linear_attn"
      - "mlp.gate"
      - "mlp.shared_expert_gate"
      - "mlp.shared_expert"

dataset:
  name: TextDataset
  data_path: ./dataset/sharegpt_gpt4/sharegpt_gpt4_calib_128_applied.jsonl
  max_seq_length: 2048
  num_samples: 128
  batch_size: 1
  shuffle: false

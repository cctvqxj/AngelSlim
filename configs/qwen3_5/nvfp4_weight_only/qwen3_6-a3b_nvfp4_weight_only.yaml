# Standard NVFP4 RTN weight-only baseline for Qwen3.6-35B-A3B.
global:
  save_path: ./output/qwen3_6_a3b_nvfp4_weight_only

model:
  name: Qwen3_5
  model_path: /root/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B/snapshots/995ad96eacd98c81ed38be0c5b274b04031597b0
  trust_remote_code: true
  low_cpu_mem_usage: true
  use_cache: false
  torch_dtype: auto
  device_map: cpu
  enable_expert_parallel: false

compression:
  name: PTQ
  quantization:
    name: nvfp4_weight_only
    bits: 4
    cpu_convert: false
    quant_method:
      weight: "per-group"
      group_size: 16
      dequant_to_bf16: false
    ignore_layers:
      - "lm_head"
      - "visual"
      - "self_attn"
      - "linear_attn"
      - "mlp.gate"
      - "mlp.shared_expert_gate"
      - "mlp.shared_expert"
